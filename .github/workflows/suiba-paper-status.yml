name: SuiBa PAPER status
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type CHECK-PAPER-STATUS or CHECK-PAPER-DIAGNOSTICS"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: suiba-paper-status
  cancel-in-progress: false
jobs:
  paper-status:
    # Repository variable, NOT an Environment variable: evaluated before job startup.
    # Missing/false disables all SSH. Do not enable until separately approved.
    # Read-only operations run in the sakura-vps-read Environment, which
    # holds the same SSH secrets but has NO required reviewers, so status
    # and diagnostics no longer need an approval tap (2026-11-07). The
    # fixed wrapper only exposes read-only status/diagnose operations;
    # state-changing workflows stay in the approval-gated sakura-vps.
    if: github.ref == 'refs/heads/main' && (inputs.confirmation == 'CHECK-PAPER-STATUS' || inputs.confirmation == 'CHECK-PAPER-DIAGNOSTICS') && vars.SUIBA_PAPER_STATUS_ENABLED == 'true'
    environment: sakura-vps-read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read PAPER status through the fixed wrapper
        env:
          PAPER_STATUS_CONFIRMATION: ${{ inputs.confirmation }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash sui-ai-trading-bot/docker/ssh-paper-status.sh
