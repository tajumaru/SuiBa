name: SuiBa dependency review
on:
  pull_request:
    paths:
      - "sui-ai-trading-bot/**/package.json"
      - "sui-ai-trading-bot/pnpm-lock.yaml"
      - "sui-ai-trading-bot/pnpm-workspace.yaml"
      - ".github/workflows/**"
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          license-check: false
