name: SuiBa public pre-run snapshot export
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "公開artifactへ抽出データを出します。EXPORT-PAPER-PUBLIC と入力"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: suiba-paper-export
  cancel-in-progress: false
jobs:
  export:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'EXPORT-PAPER-PUBLIC' && vars.SUIBA_PAPER_EXPORT_ENABLED == 'true'
    environment: sakura-vps
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Export only the verified pre-run public extract
        env:
          PAPER_EXPORT_CONFIRMATION: ${{ inputs.confirmation }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash sui-ai-trading-bot/docker/ssh-paper-export.sh
      - uses: actions/upload-artifact@v4
        with:
          name: suiba-pre-run-public-${{ github.run_id }}
          path: ${{ runner.temp }}/suiba-public-export/
          if-no-files-found: error
          retention-days: 1
