name: SuiBa production check and Issue notification
on:
  schedule:
    # Six offset schedules, all off the congested quarter hours: GitHub's
    # scheduler is best-effort and dropped most paper-monitor slots on
    # 2026-11-09 (6 fires in ~13 hours). Same density fix as the paper
    # monitor (PR #152), with minutes interleaved so the two monitors
    # never fire in the same minute.
    - cron: '7,37 * * * *'
    - cron: '17,47 * * * *'
    - cron: '27,57 * * * *'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Read-only production check and Issue notification'
        required: true
        type: choice
        options:
          - CHECK-PROD-MONITOR
permissions:
  contents: read
concurrency:
  group: suiba-production-monitor
  cancel-in-progress: false
jobs:
  check:
    # Repository variable (not Environment variable). Missing/false means no SSH.
    # The observe environment holds only the read-only suiba-observe key and
    # has no required reviewers, so scheduled runs never wait for approval.
    if: >-
      github.ref == 'refs/heads/main' && vars.SUIBA_PROD_MONITOR_ENABLED == 'true' &&
      (github.event_name == 'schedule' || inputs.confirmation == 'CHECK-PROD-MONITOR')
    environment: sakura-vps-observe
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      report: ${{ steps.report.outputs.report }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - name: Read production status through the read-only observe identity
        id: observation
        env:
          PRODUCTION_REPORT_FILE: ${{ runner.temp }}/suiba-production-monitor.json
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          # The port is a repository variable, not a secret: as a secret its
          # value "22" is a masking token, and any job output containing the
          # substring "22" (a run id, a timestamp) is silently dropped by the
          # runner ("Skip output ... may contain secret"), which once turned
          # healthy observations into PAPER_CHECK_FAILED fallbacks.
          VPS_PORT: ${{ vars.SUIBA_OBSERVE_VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash sui-ai-trading-bot/docker/ssh-prod-status.sh
      - name: Export only the validated observation, including read failures
        if: always()
        id: report
        env:
          PRODUCTION_REPORT_FILE: ${{ runner.temp }}/suiba-production-monitor.json
          OBSERVATION_OUTCOME: ${{ steps.observation.outcome }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { notificationReport } from './sui-ai-trading-bot/docker/production-notify.mjs';
          let raw = '';
          if (process.env.OBSERVATION_OUTCOME === 'success') {
            try { raw = readFileSync(process.env.PRODUCTION_REPORT_FILE, 'utf8'); } catch {}
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'report=' + JSON.stringify(notificationReport(raw)) + '\n');
          JS
  notify:
    # Keep this gate as well: a skipped read must never open/close an Issue.
    if: >-
      always() && needs.check.result != 'skipped' && github.ref == 'refs/heads/main' &&
      vars.SUIBA_PROD_MONITOR_ENABLED == 'true' &&
      (github.event_name == 'schedule' || inputs.confirmation == 'CHECK-PROD-MONITOR')
    needs: check
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - name: Reconcile only dedicated production alert Issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_MONITOR_REPORT: ${{ needs.check.outputs.report }}
        run: node sui-ai-trading-bot/docker/production-notify.mjs
