name: SuiBa MemWAL runtime configuration
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type UPDATE-MEMWAL-RUNTIME (does not restart production)"
        required: true
        type: string
      enabled:
        description: "Explicit MemWAL flag for the next release/start"
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
permissions:
  contents: read
concurrency:
  group: suiba-production-control
  cancel-in-progress: false
jobs:
  memwal-runtime:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'UPDATE-MEMWAL-RUNTIME' && vars.SUIBA_PROD_CONTROL_ENABLED == 'true'
    environment: sakura-vps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Update only MemWAL runtime variables through the fixed helper
        env:
          MEMWAL_RUNTIME_CONFIRMATION: ${{ inputs.confirmation }}
          SUIBA_MEMWAL_ENABLED: ${{ inputs.enabled }}
          MEMWAL_PRIVATE_KEY: ${{ secrets.SUIBA_MEMWAL_PRIVATE_KEY }}
          MEMWAL_ACCOUNT_ID: 0x45c49b20f568a54db56f15e150739df08d61d4495a3fa6ff5d609ccd3ef15578
          MEMWAL_RELAYER_URL: https://relayer.memory.walrus.xyz
          MEMWAL_NAMESPACE: potario
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash sui-ai-trading-bot/docker/ssh-memwal-runtime.sh
