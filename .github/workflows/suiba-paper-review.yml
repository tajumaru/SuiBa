name: SuiBa run review (stage 1)

# Counterfactual review of the decisions in a public export artifact.
# Read-only with respect to the VPS (it never connects); the only writes
# are a comment on the standing review Issue. No environment approval:
# nothing privileged is involved. Token-free by design — this is plain
# GitHub Actions machinery, replacing per-run agent analysis.
#
# Runs two ways: manually (workflow_dispatch with the export run id), or
# automatically when the export workflow OR a validation cycle completes
# (workflow_run) — a cycle exports the previous run's snapshot right after
# its start, under its own approval, with the same artifact shape. On the
# automatic path a triggering run without the artifact (gate-skipped or
# failed export) ends the job quietly; on the manual path a missing
# artifact is an operator error and fails.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "REVIEW-PAPER と入力"
        required: true
        type: string
      export_run_id:
        description: "対象の export ワークフロー実行 ID"
        required: true
        type: string
  workflow_run:
    workflows: ["SuiBa public pre-run snapshot export", "SuiBa PAPER validation cycle"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: suiba-paper-review
  cancel-in-progress: false

jobs:
  review:
    if: vars.SUIBA_PAPER_REVIEW_ENABLED == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.confirmation == 'REVIEW-PAPER' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Resolve the export run id
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_ID: ${{ inputs.export_run_id }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "run_id=$TRIGGER_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=$INPUT_RUN_ID" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the export artifact
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          EXPORT_RUN_ID: ${{ steps.target.outputs.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          gh run download "$EXPORT_RUN_ID" --dir export-data || true
          if find export-data -name 'SUI_USDC.sqlite' -print -quit 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "No export artifact on the triggering run (export gate-skipped or failed); nothing to review."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo 'SUI_USDC.sqlite not found in the export artifact' >&2
            exit 1
          fi
      - name: Build the review report
        if: steps.download.outputs.found == 'true'
        run: |
          DB=$(find export-data -name 'SUI_USDC.sqlite' -print -quit)
          python3 sui-ai-trading-bot/docker/run-review.py "$DB" --window last-session --out windowed.md
          python3 sui-ai-trading-bot/docker/run-review.py "$DB" --out report.md
          { echo "## 直近ランの窓"; echo; cat windowed.md; echo; cat report.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Post the report to the standing review Issue
        if: steps.download.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPORT_RUN_ID: ${{ steps.target.outputs.run_id }}
        run: |
          gh label create suiba-run-review --force --color 1d76db \
            --description 'SuiBa 振り返りレポート（自動）' >/dev/null 2>&1 || true
          { echo "対象 export: https://github.com/${{ github.repository }}/actions/runs/${EXPORT_RUN_ID}";
            echo; echo "## 直近ランの窓"; echo; cat windowed.md; echo; cat report.md; } > comment.md
          NUM=$(gh issue list --label suiba-run-review --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            gh issue create --label suiba-run-review \
              --title 'SuiBa 振り返りレポート（自動）' --body-file comment.md
          else
            gh issue comment "$NUM" --body-file comment.md
          fi
