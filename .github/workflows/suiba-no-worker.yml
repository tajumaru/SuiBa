name: SuiBa verification without Worker
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Light path: typecheck, lint, build, render smoke and the unit
  # suites. Runs for every change and finishes in about a minute.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sui-ai-trading-bot
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record the exact checked-out commit
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          printf 'Verified HEAD: %s\n' "${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
      # The pnpm version comes from package.json's
      # packageManager pin, via Corepack.
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
      - run: node scripts/verify-node-version.mjs
      # Hand-rolled store cache: setup-node's own pnpm cache
      # resolves the store path from the repository root, where
      # no package.json pins a pnpm — it computed a store this
      # pnpm never used and failed the job saving it. Resolved
      # here, inside the app directory, the path is this pnpm's.
      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('sui-ai-trading-bot/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      # The browser payload is large and versioned by the lockfile;
      # cache it. System dependencies still install on every run,
      # because the runner image's library set is not pinned.
      - name: Cache the render-smoke browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('sui-ai-trading-bot/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-
      - name: Install the render-smoke browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Render smoke (the built dashboard mounts, styles apply)
        run: node scripts/render-smoke.mjs
      - name: Audited unit tests with subprocess and network guards
        run: node node_modules/vitest/vitest.mjs run --config vitest.no-worker.config.ts
      - name: Offline data helpers and mocked deployment failures (no Worker)
        run: node --import tsx --test docker/vps-data.node.mjs docker/vps-deploy.node.mjs
      - name: Shell syntax and ShellCheck
        run: |
          # Every shell script in the repository is gated, not a
          # hand-picked list: the setup scripts run as root on the
          # VPS, and a quoting slip in one once shipped unnoticed
          # precisely because it was not listed here.
          scripts=$(printf '%s\n' docker/*.sh deploy/broker/*.sh deploy/paper-check/*.sh deploy/paper-check/suiba-paper-check)
          for script in $scripts; do bash -n "$script"; done
          shellcheck $scripts
      - name: SSH preflight mock tests (no real SSH or keys)
        run: node --test docker/ssh-preflight.node.mjs
      - name: Production observation and Issue lifecycle mocks (no SSH or GitHub writes)
        run: |
          python3 -I docker/test_production_monitor.py
          node --test docker/production-notify.node.mjs
      - name: PAPER controller failure tests (no Worker)
        run: |
          # Syntax-gate every deploy Python file on the light path too:
          # the verify harnesses otherwise surface only in heavy runs.
          python3 -m py_compile deploy/paper-check/controller.py deploy/paper-check/watchdog.py deploy/paper-check/verify_watchdog.py deploy/paper-check/verify_run.py deploy/paper-check/verify_prod.py deploy/paper-check/verify_timer.py deploy/paper-check/test_controller.py deploy/paper-check/test_setup.py deploy/paper-check/test_watchdog.py deploy/broker/broker.py deploy/broker/verify_docker.py
          python3 -I deploy/paper-check/test_controller.py
          python3 -I deploy/paper-check/test_setup.py
          python3 -I deploy/paper-check/test_watchdog.py
          shellcheck deploy/paper-check/suiba-paper-check
          sudo visudo -cf deploy/paper-check/suiba-paper-check.sudoers
          systemd-analyze verify deploy/paper-check/*.service deploy/paper-check/*.timer
  # Heavy path: the Docker/packaging suites for the deploy machinery.
  # They run in parallel with the light job; wall time is the longer
  # of the two, not the sum. The suites below re-run only when that
  # machinery (or the code it packages, or the dependency manifests,
  # or the tests themselves) changed. Anything else — a dashboard
  # change, say — cannot change their outcome. Scheduled and
  # dispatched runs always take the heavy path, and a failed
  # comparison fails safe to heavy as well.
  docker-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sui-ai-trading-bot
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Decide whether the heavy suites are needed
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          heavy=true
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              range="${{ github.event.before }}...${{ github.sha }}"
            else
              range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
            fi
            files="$(gh api "repos/${{ github.repository }}/compare/$range" --jq '.files[].filename' 2>/dev/null || true)"
            if [ -z "$files" ]; then
              echo "Comparison unavailable; running the heavy suites."
            elif printf '%s\n' "$files" | grep -Eq '^sui-ai-trading-bot/(docker|deploy|scripts|tests|apps/worker|packages)/|^sui-ai-trading-bot/(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$|^\.github/workflows/'; then
              echo "Deploy machinery or packaged code changed; running the heavy suites."
            else
              heavy=false
              echo "No heavy-suite inputs changed; skipping the Docker/packaging suites."
            fi
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
      # The two Compose/fixture verifiers below are plain Node with
      # no repository dependencies, so this job needs the runtime
      # only — no Corepack, no pnpm install.
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
      - name: Broker security and limited sudo (disposable Ubuntu, no Worker)
        if: steps.changes.outputs.heavy == 'true'
        run: |
          docker build -f docker/Dockerfile.broker-test -t suiba-broker-tests .
          docker run --rm --network none --memory 512m --memory-swap 512m --pids-limit 128 suiba-broker-tests
      - name: Render and verify the production Compose model
        if: steps.changes.outputs.heavy == 'true'
        run: |
          sudo mkdir -p /opt/suiba/shared
          sudo touch /opt/suiba/shared/runtime.env /opt/suiba/shared/admin-token
          node docker/verify-vps-config.mjs
      - name: Build image without running its default command
        if: steps.changes.outputs.heavy == 'true'
        run: docker build --build-arg SUIBA_BUILD_SHA=${{ github.sha }} -f docker/Dockerfile -t suiba-no-worker:${{ github.sha }} .
      - name: Isolated HTTP/SQLite/process fixtures, never Worker
        if: steps.changes.outputs.heavy == 'true'
        run: node docker/verify-vps-offline.mjs suiba-no-worker:${{ github.sha }}
      - name: Real broker transaction with dummy HTTP and cold restore (no Worker)
        if: steps.changes.outputs.heavy == 'true'
        run: sudo /usr/bin/python3 -I deploy/broker/verify_docker.py suiba-no-worker:${{ github.sha }}
      - name: Independent systemd cutoff with Docker dummy (no Worker)
        if: steps.changes.outputs.heavy == 'true'
        run: sudo /usr/bin/python3 -I deploy/paper-check/verify_timer.py suiba-no-worker:${{ github.sha }}
      - name: Validation controller crash and recovery with Docker dummy (no Worker)
        if: steps.changes.outputs.heavy == 'true'
        run: |
          df -h /var/lib
          docker system df
          sudo /usr/bin/python3 -I deploy/paper-check/verify_run.py suiba-no-worker:${{ github.sha }}
      - name: Production service lifecycle with Docker dummy (no Worker)
        if: steps.changes.outputs.heavy == 'true'
        run: sudo /usr/bin/python3 -I deploy/paper-check/verify_prod.py suiba-no-worker:${{ github.sha }}
      - name: Read-only watchdog timer and journal (no Worker or recovery)
        if: steps.changes.outputs.heavy == 'true'
        run: sudo /usr/bin/python3 -I deploy/paper-check/verify_watchdog.py
