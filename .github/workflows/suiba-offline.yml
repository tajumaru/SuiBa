name: SuiBa offline validation
on:
  push:
    paths:
      - "sui-ai-trading-bot/**"
      - ".github/workflows/suiba-offline.yml"
      - ".github/workflows/suiba-no-worker.yml"
      - ".github/workflows/suiba-vps.yml"
      - ".github/workflows/suiba-vps-stage.yml"
      - ".github/workflows/suiba-ssh-preflight.yml"
      - ".github/workflows/suiba-paper-status.yml"
  pull_request:
    paths:
      - "sui-ai-trading-bot/**"
      - ".github/workflows/suiba-offline.yml"
      - ".github/workflows/suiba-no-worker.yml"
      - ".github/workflows/suiba-vps.yml"
      - ".github/workflows/suiba-vps-stage.yml"
      - ".github/workflows/suiba-ssh-preflight.yml"
      - ".github/workflows/suiba-paper-status.yml"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "After separate approval, type RUN-WORKER-CI (starts PAPER test Workers)"
        required: true
        type: string
permissions:
  contents: read
# Rapid successive pushes used to run the full suite side by
# side and pile up in the queue; per ref, only the newest run
# matters. A manually dispatched Worker CI run is never
# cancelled out from under its operator.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  without-worker:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/suiba-no-worker.yml
    permissions:
      contents: read
  offline:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmation == 'RUN-WORKER-CI' && vars.SUIBA_WORKER_CI_ENABLED == 'true'
    environment: worker-ci
    # Without a cap a hung Worker test burns the 360-minute
    # platform default on both matrix legs.
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sui-ai-trading-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - run: node scripts/verify-node-version.mjs
      # The pnpm version comes from package.json's
      # packageManager pin, via Corepack.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test:offline
      - name: Verify PAPER deployment safety over loopback
        run: node node_modules/vitest/vitest.mjs run tests/deployment-api.test.ts
      - name: Verify Linux packaged-worker cutover and rollback
        if: runner.os == 'Linux'
        run: node node_modules/vitest/vitest.mjs run tests/linux-release-process.test.ts
      - name: Check Linux unit and restricted sudo syntax in a disposable container
        if: runner.os == 'Linux'
        run: |
          docker build -f docker/Dockerfile.linux-release-test -t suiba-linux-release-test .
          docker run --rm --network none suiba-linux-release-test
          docker run --rm --network none --user root suiba-linux-release-test node deploy/linux/check-container-launcher.mjs
