# Defer automatic restarts of the SuiBa PAPER supervisors and their runtime.
# These services are restarted manually during a planned maintenance window.
$nrconf{override_rc}{qr(^suiba-paper-check\.service$)} = 0;
$nrconf{override_rc}{qr(^suiba-prod\.service$)} = 0;
$nrconf{override_rc}{qr(^suiba-prod-watchdog\.service$)} = 0;
$nrconf{override_rc}{qr(^suiba-prod-watchdog\.timer$)} = 0;
$nrconf{override_rc}{qr(^suiba-paper-check-cutoff\.service$)} = 0;
$nrconf{override_rc}{qr(^suiba-paper-check-cutoff\.timer$)} = 0;
$nrconf{override_rc}{qr(^suiba-paper-check-cutoff-2h\.timer$)} = 0;
$nrconf{override_rc}{qr(^suiba-paper-check-cutoff-6h\.timer$)} = 0;
$nrconf{override_rc}{qr(^suiba-paper-check-cutoff-24h\.timer$)} = 0;
$nrconf{override_rc}{qr(^docker\.service$)} = 0;
$nrconf{override_rc}{qr(^containerd\.service$)} = 0;
