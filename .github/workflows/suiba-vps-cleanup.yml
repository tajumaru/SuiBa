name: SuiBa VPS incoming cleanup
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type CLEAN-INCOMING"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: suiba-vps-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    # Repository variable, NOT an Environment variable: evaluated before job startup.
    # Missing/false disables all SSH. Deleting uploads is destructive, so this
    # workflow carries its own enable variable on top of the Environment approval.
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'CLEAN-INCOMING' && vars.SUIBA_CLEANUP_ENABLED == 'true'
    environment: sakura-vps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Remove stale incoming uploads over pinned SSH
        env:
          CLEANUP_CONFIRMATION: ${{ inputs.confirmation }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash sui-ai-trading-bot/docker/ssh-clean-incoming.sh
